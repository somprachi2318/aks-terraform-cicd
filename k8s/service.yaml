apiVersion: v1
kind: Service
metadata:
  name: banking-service
  namespace: default
spec:
  # ClusterIP exposes this app inside the Kubernetes cluster.
  type: ClusterIP
  # Send traffic to pods with the same label as the Deployment.
  selector:
    app: banking-app
  ports:
    - name: http
      # Port clients use when connecting to this Service.
      port: 80
      # Forward traffic to the app's container port.
      targetPort: 5000
      protocol: TCP
