apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-app
  namespace: default
  labels:
    app: banking-app
spec:
  # Run two copies so a pod can be restarted without stopping all replicas.
  replicas: 2
  selector:
    matchLabels:
      app: banking-app
  template:
    metadata:
      labels:
        app: banking-app
    spec:
      # The Docker image runs as this non-root user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: banking-app
          # Image published to the project's Azure Container Registry.
          image: akscicd1p54c.azurecr.io/aks-flask-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          # Restart the container if the Flask health endpoint stops responding.
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Send traffic to this pod only after the app reports healthy.
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Reserve modest resources and limit each replica for a small lab.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Keep the container from gaining extra operating-system privileges.
          securityContext:
            allowPrivilegeEscalation: false
